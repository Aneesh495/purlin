name: Purlin CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-and-test:
    name: Verify, Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Koka Compiler
        run: |
          KOKA_VER="3.2.9"
          install_dir="$RUNNER_TEMP/purlin-koka"
          mkdir -p "$install_dir"
          curl -fsSL "https://github.com/koka-lang/koka/releases/download/v${KOKA_VER}/koka-v${KOKA_VER}-linux-x64.tar.gz" -o "$install_dir/koka.tar.gz"
          tar -xzf "$install_dir/koka.tar.gz" -C "$install_dir"
          koka_bin="$(find "$install_dir" -path '*/bin/koka' -print -quit)"
          test -n "$koka_bin"
          "$koka_bin" --version
          dirname "$koka_bin" >> "$GITHUB_PATH"

      - name: Verify No Em Dashes
        run: |
          python3 scripts/verify_no_em_dash.py

      - name: Build C Kernel Glue Layer
        run: make c-glue

      - name: Run RFC Conformance Testbench
        run: |
          python3 harness/rfc_conformance.py

      - name: Run Clos Fabric Chaos Simulation
        run: |
          python3 harness/simulate_clos.py

      - name: Run Wire Frame Boundary Fuzzer
        run: |
          python3 harness/fuzz_wire.py

      - name: Run Automated Testbench Harness
        run: |
          python3 harness/testbench.py

      - name: Run Koka Unit and Integration Tests
        run: |
          make test
